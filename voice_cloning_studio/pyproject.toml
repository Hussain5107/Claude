[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Form()/File()/Depends() are meant to be used as call-as-default
# argument values -- that's the framework's dependency-injection pattern, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
